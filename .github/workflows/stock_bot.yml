name: Stock Chart Bot

on:
  schedule:
    # UTC times (TR: +3 saat)
    - cron: "0 7  * * *"   # TR 10:00 - Trending (bugünün en çok hareket eden hissesi)
    - cron: "0 10 * * *"   # TR 13:00 - DCA (aylık yatırım senaryosu)
    - cron: "0 13 * * *"   # TR 16:00 - Loss (çöküş senaryosu)
    - cron: "0 16 * * *"   # TR 19:00 - Buffett (Berkshire portföyü)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Patch font paths for Linux
        run: |
          for f in stock_bot.py trending_video.py dca_video.py loss_video.py buffett_video.py; do
            [ -f "$f" ] || continue
            sed -i 's|C:/Windows/Fonts/|/usr/share/fonts/truetype/liberation/|g' "$f"
            sed -i 's|"arialbd.ttf"|"LiberationSans-Bold.ttf"|g'   "$f"
            sed -i 's|"arial.ttf"|"LiberationSans-Regular.ttf"|g'  "$f"
          done

      - name: Run stock bot
        env:
          TOKEN_JSON:   ${{ secrets.TOKEN_JSON }}
          PIXABAY_KEY:  ${{ secrets.PIXABAY_KEY }}
        run: python stock_bot.py

      - name: Commit used-stocks tracker
        run: |
          git config user.name  "Stock Bot"
          git config user.email "bot@github.com"
          git add kullanilan_hisseler.json || true
          git diff --staged --quiet || git commit -m "chore: update used stocks [skip ci]"
          git push origin HEAD
